name: Build Android module

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform
        run: sdkmanager 'platforms;android-33' 'build-tools;33.0.2'
      - name: Test and build
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Inspect and stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DSHGoShellPolicy-debug.apk
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --verbose --print-certs dist/DSHGoShellPolicy-debug.apk | tee dist/signature.txt
          "$ANDROID_HOME/build-tools/33.0.2/aapt" dump badging dist/DSHGoShellPolicy-debug.apk > dist/package.txt
          cd dist
          sha256sum DSHGoShellPolicy-debug.apk > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DSHGoShellPolicy-debug
          path: dist/*
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
